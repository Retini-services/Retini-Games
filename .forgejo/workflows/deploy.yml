name: Deploy to Codeberg Pages
on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Deploy to Pages branch
        run: |
          git config user.name "Forgejo Action"
          git config user.email "action@noreply.codeberg.org"
          
          # Force push the contents of main directly into the pages branch
          git push --force origin main:pages
